<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Headphone stand mockup">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="85%"><stop offset="0" stop-color="#f4f4f1"/><stop offset="1" stop-color="#dfdfdb"/></radialGradient>
    <pattern id="layers" width="8" height="4" patternUnits="userSpaceOnUse"><rect width="8" height="1" fill="#fff" fill-opacity=".07"/></pattern>
    <filter id="sh" x="-30%" y="-20%" width="160%" height="150%"><feDropShadow dx="0" dy="22" stdDeviation="18" flood-opacity=".22"/></filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <ellipse cx="400" cy="672" rx="210" ry="30" fill="#000" opacity=".1"/>
  <g filter="url(#sh)">
    <ellipse cx="400" cy="650" rx="170" ry="40" fill="#141414"/>
    <ellipse cx="400" cy="640" rx="170" ry="40" fill="#262626"/>
    <path d="M370 640 C 360 500, 380 330, 380 260 L420 260 C 420 330, 440 500, 430 640 Z" fill="#202020"/>
    <path d="M370 640 C 360 500, 380 330, 380 260 L420 260 C 420 330, 440 500, 430 640 Z" fill="url(#layers)"/>
    <path d="M300 250 C 300 210, 500 210, 500 250 L500 270 C 500 240, 300 240, 300 270 Z" fill="#2a2a2a"/>
    <!-- headphones -->
    <path d="M285 420 C 270 170, 530 170, 515 420" fill="none" stroke="#bdbdb8" stroke-width="26" stroke-linecap="round"/>
    <path d="M285 420 C 270 170, 530 170, 515 420" fill="none" stroke="#e9e9e5" stroke-width="10" stroke-linecap="round"/>
    <rect x="240" y="380" width="70" height="130" rx="30" fill="#d4d4cf"/>
    <rect x="490" y="380" width="70" height="130" rx="30" fill="#d4d4cf"/>
    <rect x="262" y="395" width="30" height="100" rx="14" fill="#a9a9a4"/>
    <rect x="508" y="395" width="30" height="100" rx="14" fill="#a9a9a4"/>
  </g>
</svg>
