<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Wall key holder mockup">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#efefec"/><stop offset="1" stop-color="#e2e2de"/></linearGradient>
    <pattern id="layers" width="8" height="3" patternUnits="userSpaceOnUse"><rect width="8" height="1" fill="#fff" fill-opacity=".06"/></pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity=".2"/></filter>
  </defs>
  <rect width="800" height="800" fill="url(#wall)"/>
  <g filter="url(#sh)">
    <rect x="160" y="250" width="480" height="120" rx="20" fill="#1c1c1c"/>
    <rect x="160" y="250" width="480" height="120" rx="20" fill="url(#layers)"/>
    <text x="190" y="325" font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="44" letter-spacing="10" fill="#f5f5f2">HOME</text>
    <g fill="#1c1c1c">
      <path d="M440 370 v60 a24 24 0 0 0 48 0 v-8 h-14 v8 a10 10 0 0 1 -20 0 v-60z"/>
      <path d="M520 370 v60 a24 24 0 0 0 48 0 v-8 h-14 v8 a10 10 0 0 1 -20 0 v-60z"/>
      <path d="M360 370 v60 a24 24 0 0 0 48 0 v-8 h-14 v8 a10 10 0 0 1 -20 0 v-60z"/>
    </g>
  </g>
  <!-- keys -->
  <g fill="#b8b8b3" filter="url(#sh)">
    <circle cx="384" cy="470" r="26" fill="none" stroke="#9a9a96" stroke-width="8"/>
    <rect x="378" y="494" width="14" height="110" rx="4"/>
    <rect x="390" y="560" width="22" height="10"/><rect x="390" y="582" width="16" height="10"/>
    <circle cx="544" cy="470" r="26" fill="none" stroke="#9a9a96" stroke-width="8"/>
    <rect x="530" y="494" width="70" height="40" rx="12" fill="#c62828"/>
  </g>
</svg>
