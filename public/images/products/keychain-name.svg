<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Name keychain mockup">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#f4f4f1"/><stop offset="1" stop-color="#e3e3df"/></radialGradient>
    <pattern id="layers" width="8" height="3" patternUnits="userSpaceOnUse"><rect width="8" height="1" fill="#000" fill-opacity=".07"/></pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-opacity=".18"/></filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <ellipse cx="420" cy="560" rx="270" ry="34" fill="#000" opacity=".08"/>
  <g transform="rotate(-8 400 420)" filter="url(#sh)">
    <!-- ring -->
    <circle cx="150" cy="420" r="62" fill="none" stroke="#b9b9b4" stroke-width="12"/>
    <circle cx="150" cy="420" r="62" fill="none" stroke="#ffffff" stroke-opacity=".5" stroke-width="3" stroke-dasharray="40 300"/>
    <!-- plate (side) -->
    <rect x="190" y="352" width="470" height="150" rx="40" fill="#1a1a1a"/>
    <!-- plate (top) -->
    <rect x="190" y="340" width="470" height="150" rx="40" fill="#2b2b2b"/>
    <rect x="190" y="340" width="470" height="150" rx="40" fill="url(#layers)"/>
    <circle cx="232" cy="415" r="16" fill="url(#bg)"/>
    <!-- raised letters -->
    <g font-family="Arial Black, Helvetica, sans-serif" font-weight="900" font-size="74" letter-spacing="1" text-anchor="middle">
      <text x="447" y="444" fill="#c9c9c4" textLength="370" lengthAdjust="spacingAndGlyphs">NUSRAT</text>
      <text x="445" y="438" fill="#f7f7f4" textLength="370" lengthAdjust="spacingAndGlyphs">NUSRAT</text>
    </g>
  </g>
</svg>
