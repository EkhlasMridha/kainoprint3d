<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Custom logo keychain mockup">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="80%"><stop offset="0" stop-color="#f4f4f1"/><stop offset="1" stop-color="#e1e1dd"/></radialGradient>
    <pattern id="layers" width="8" height="3" patternUnits="userSpaceOnUse"><rect width="8" height="1" fill="#000" fill-opacity=".08"/></pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-opacity=".2"/></filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <g filter="url(#sh)" transform="rotate(-10 400 430)">
    <circle cx="400" cy="185" r="55" fill="none" stroke="#b5b5b0" stroke-width="12"/>
    <rect x="230" y="262" width="340" height="340" rx="70" fill="#0d0d0d"/>
    <rect x="230" y="250" width="340" height="340" rx="70" fill="#1d1d1d"/>
    <rect x="230" y="250" width="340" height="340" rx="70" fill="url(#layers)"/>
    <circle cx="400" cy="292" r="16" fill="url(#bg)"/>
    <!-- abstract logo mark -->
    <g transform="translate(400 445)">
      <circle r="95" fill="none" stroke="#f5f5f2" stroke-width="16"/>
      <path d="M-50 40 L0 -55 L50 40 Z" fill="#f5f5f2"/>
      <circle cx="0" cy="12" r="18" fill="#1d1d1d"/>
    </g>
  </g>
  <text x="400" y="730" text-anchor="middle" font-family="Courier New, monospace" font-size="22" letter-spacing="6" fill="#8a8a85">YOUR LOGO HERE</text>
</svg>
