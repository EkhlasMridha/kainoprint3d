<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Minimal desk organizer tray mockup">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="85%"><stop offset="0" stop-color="#f5f5f2"/><stop offset="1" stop-color="#e0e0dc"/></radialGradient>
    <pattern id="layers" width="8" height="4" patternUnits="userSpaceOnUse"><rect width="8" height="1" fill="#000" fill-opacity=".07"/></pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="22" stdDeviation="20" flood-opacity=".18"/></filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <g filter="url(#sh)">
    <!-- isometric tray: top rim -->
    <path d="M120 420 L400 300 L680 420 L400 540 Z" fill="#fbfbf9"/>
    <!-- left & right walls -->
    <path d="M120 420 L400 540 L400 640 L120 520 Z" fill="#dcdcd7"/>
    <path d="M400 540 L680 420 L680 520 L400 640 Z" fill="#c9c9c4"/>
    <path d="M120 420 L400 540 L400 640 L120 520 Z" fill="url(#layers)"/>
    <path d="M400 540 L680 420 L680 520 L400 640 Z" fill="url(#layers)"/>
    <!-- inner cavities -->
    <path d="M150 422 L250 379 L376 433 L276 476 Z" fill="#e7e7e3"/>
    <path d="M272 370 L400 315 L526 369 L398 424 Z" fill="#e7e7e3"/>
    <path d="M300 488 L548 382 L650 425 L402 531 Z" fill="#e7e7e3"/>
    <path d="M150 422 L250 379 L250 400 L162 437 Z" fill="#d2d2cd"/>
    <path d="M272 370 L400 315 L400 336 L284 385 Z" fill="#d2d2cd"/>
    <path d="M300 488 L548 382 L548 403 L312 503 Z" fill="#d2d2cd"/>
    <!-- contents -->
    <rect x="300" y="352" width="160" height="14" rx="7" fill="#1b1b1b" transform="rotate(-23 380 359)"/>
    <rect x="330" y="372" width="130" height="12" rx="6" fill="#1e4fa3" transform="rotate(-23 395 378)"/>
    <circle cx="210" cy="420" r="22" fill="#f2c200"/>
    <circle cx="245" cy="438" r="16" fill="#1b1b1b"/>
    <rect x="430" y="440" width="120" height="40" rx="6" fill="#ffffff" stroke="#bdbdb8" stroke-width="2" transform="rotate(-23 490 460)"/>
  </g>
</svg>
