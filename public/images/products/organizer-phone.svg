<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Desk organizer with phone stand mockup">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="85%"><stop offset="0" stop-color="#f4f4f1"/><stop offset="1" stop-color="#dfdfdb"/></radialGradient>
    <pattern id="layers" width="8" height="4" patternUnits="userSpaceOnUse"><rect width="8" height="1" fill="#fff" fill-opacity=".06"/></pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="22" stdDeviation="20" flood-opacity=".22"/></filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <g filter="url(#sh)">
    <!-- base block -->
    <path d="M110 470 L380 360 L690 480 L420 590 Z" fill="#3a3a3a"/>
    <path d="M110 470 L420 590 L420 660 L110 540 Z" fill="#1f1f1f"/>
    <path d="M420 590 L690 480 L690 550 L420 660 Z" fill="#171717"/>
    <path d="M110 470 L420 590 L420 660 L110 540 Z" fill="url(#layers)"/>
    <path d="M420 590 L690 480 L690 550 L420 660 Z" fill="url(#layers)"/>
    <!-- pen cup -->
    <path d="M170 330 L250 297 L330 330 L250 363 Z" fill="#2c2c2c"/>
    <path d="M170 330 L250 363 L250 520 L170 487 Z" fill="#232323"/>
    <path d="M250 363 L330 330 L330 487 L250 520 Z" fill="#181818"/>
    <path d="M182 331 L250 303 L318 331 L250 359 Z" fill="#0d0d0d"/>
    <rect x="215" y="200" width="12" height="140" rx="6" fill="#f2c200" transform="rotate(-8 221 270)"/>
    <rect x="245" y="215" width="12" height="125" rx="6" fill="#f5f5f2" transform="rotate(6 251 277)"/>
    <rect x="270" y="230" width="10" height="110" rx="5" fill="#c62828" transform="rotate(14 275 285)"/>
    <!-- phone slot back support -->
    <path d="M470 430 L600 377 L600 405 L470 458 Z" fill="#2b2b2b"/>
    <!-- phone -->
    <path d="M440 230 L560 182 L600 395 L480 443 Z" fill="#0b0b0b"/>
    <path d="M452 240 L552 200 L588 388 L488 428 Z" fill="#20334f"/>
    <path d="M452 240 L552 200 L566 272 L466 312 Z" fill="#2c4a72" opacity=".7"/>
    <!-- front lip -->
    <path d="M460 470 L610 409 L610 432 L460 493 Z" fill="#2f2f2f"/>
  </g>
</svg>
