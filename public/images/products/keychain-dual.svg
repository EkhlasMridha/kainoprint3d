<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Two-colour name keychains mockup">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="80%"><stop offset="0" stop-color="#f5f5f2"/><stop offset="1" stop-color="#e2e2de"/></radialGradient>
    <pattern id="layers" width="8" height="3" patternUnits="userSpaceOnUse"><rect width="8" height="1" fill="#000" fill-opacity=".08"/></pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-opacity=".17"/></filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <g transform="rotate(6 400 300)" filter="url(#sh)">
    <circle cx="175" cy="300" r="44" fill="none" stroke="#b5b5b0" stroke-width="10"/>
    <rect x="205" y="246" width="420" height="118" rx="59" fill="#d9d9d4"/>
    <rect x="205" y="238" width="420" height="118" rx="59" fill="#f3f3ef"/>
    <rect x="205" y="238" width="420" height="118" rx="59" fill="url(#layers)"/>
    <circle cx="250" cy="297" r="13" fill="url(#bg)"/>
    <text x="290" y="330" font-family="Georgia, serif" font-style="italic" font-weight="700" font-size="84" fill="#1e4fa3">Ayaan</text>
  </g>
  <g transform="rotate(-5 420 560)" filter="url(#sh)">
    <circle cx="200" cy="560" r="44" fill="none" stroke="#b5b5b0" stroke-width="10"/>
    <rect x="230" y="506" width="420" height="118" rx="24" fill="#0f0f0f"/>
    <rect x="230" y="498" width="420" height="118" rx="24" fill="#262626"/>
    <rect x="230" y="498" width="420" height="118" rx="24" fill="url(#layers)"/>
    <circle cx="272" cy="557" r="13" fill="url(#bg)"/>
    <text x="310" y="590" font-family="Arial Black, Helvetica, sans-serif" font-weight="900" font-size="80" fill="#f2c200">MIM</text>
    <rect x="520" y="535" width="90" height="44" rx="10" fill="#f2c200"/>
  </g>
</svg>
