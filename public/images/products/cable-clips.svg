<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Cable clip set mockup">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="80%"><stop offset="0" stop-color="#f5f5f2"/><stop offset="1" stop-color="#e1e1dd"/></radialGradient>
    <pattern id="layers" width="8" height="3" patternUnits="userSpaceOnUse"><rect width="8" height="1" fill="#000" fill-opacity=".08"/></pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-opacity=".18"/></filter>
    <g id="clip">
      <path d="M0 60 L0 20 A40 40 0 0 1 80 20 L80 60 L62 60 L62 22 A22 22 0 0 0 18 22 L18 60 Z"/>
      <rect x="-14" y="56" width="108" height="26" rx="8"/>
    </g>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <!-- desk edge -->
  <rect x="0" y="470" width="800" height="330" fill="#d9d9d4"/>
  <rect x="0" y="470" width="800" height="10" fill="#c8c8c3"/>
  <!-- cables -->
  <path d="M-20 420 C 200 420, 220 455, 800 452" fill="none" stroke="#1b1b1b" stroke-width="16" stroke-linecap="round"/>
  <path d="M-20 445 C 260 445, 300 470, 800 470" fill="none" stroke="#f5f5f2" stroke-width="14" stroke-linecap="round" opacity=".95"/>
  <g filter="url(#sh)">
    <g transform="translate(150 390)" fill="#1b1b1b"><use href="#clip"/><use href="#clip" fill="url(#layers)"/></g>
    <g transform="translate(360 395)" fill="#f2f2ee"><use href="#clip"/><use href="#clip" fill="url(#layers)"/></g>
    <g transform="translate(570 400)" fill="#7a7a75"><use href="#clip"/><use href="#clip" fill="url(#layers)"/></g>
  </g>
  <g filter="url(#sh)" transform="translate(240 600) rotate(-14)" fill="#1e4fa3"><use href="#clip"/></g>
  <g filter="url(#sh)" transform="translate(470 610) rotate(10)" fill="#2e7d32"><use href="#clip"/></g>
</svg>
